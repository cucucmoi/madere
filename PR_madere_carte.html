<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte des PR – Madère 2026</title>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #1a1a2e; color: #eee;
       height: 100vh; display: flex; flex-direction: column; }

#header {
  background: linear-gradient(135deg, #16213e, #0f3460);
  padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  box-shadow: 0 2px 8px rgba(0,0,0,.5); flex-shrink: 0;
}
#header h1 { font-size: 1.1rem; letter-spacing: 1.5px; color: #e2b96f; white-space: nowrap; }
#header h1 small { font-size: .68rem; color: #aaa; display: block; }

.leg-row { display: flex; align-items: center; gap: 6px; font-size: .75rem; }
.swatch { width: 28px; height: 5px; border-radius: 3px; flex-shrink: 0; }
.swatch.dashed { background: repeating-linear-gradient(90deg,currentColor 0,currentColor 6px,transparent 6px,transparent 10px); }

#note { font-size: .68rem; color: #aaa; border-left: 2px solid #444; padding-left: 8px; max-width: 320px; }

#main { display: flex; flex: 1; overflow: hidden; }
#map  { flex: 1; }

#sidebar {
  width: 270px; flex-shrink: 0; background: #16213e;
  border-left: 1px solid #2a3a5e; display: flex; flex-direction: column; overflow: hidden;
}
#sidebar h2 { font-size: .78rem; font-weight: 700; letter-spacing: 1px;
              color: #aaa; padding: 10px 12px; border-bottom: 1px solid #2a3a5e; }
#pr-list { flex: 1; overflow-y: auto; }
.pr-entry {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px;
  border-bottom: 1px solid rgba(255,255,255,.05); cursor: pointer; transition: .15s;
}
.pr-entry:hover { background: rgba(255,255,255,.06); }
.pr-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.pr-code { font-size: .72rem; font-weight: 800; color: #ddd; min-width: 40px; }
.pr-name { font-size: .68rem; color: #bbb; flex: 1; }
.pr-fee  { font-size: .65rem; font-weight: 700; padding: 1px 5px; border-radius: 6px; flex-shrink: 0; }
.fee-exp    { background: #c0392b; color: #fff; }
.fee-std    { background: #e67e22; color: #fff; }
.fee-free   { background: #27ae60; color: #fff; }
.fee-closed { background: #555; color: #aaa; }

#sidebar ::-webkit-scrollbar { width: 4px; }
#sidebar ::-webkit-scrollbar-thumb { background: #2a3a5e; border-radius: 3px; }

.pr-popup { min-width: 200px; font-family: 'Segoe UI', sans-serif; }
.pr-popup h3 { font-size: .95rem; margin-bottom: 4px; }
.pr-popup .badge { display: inline-block; padding: 2px 8px; border-radius: 8px;
                   font-weight: 700; font-size: .8rem; margin-bottom: 5px; }
.pr-popup .meta { font-size: .78rem; color: #555; margin: 3px 0; }
.pr-popup a { font-size: .73rem; color: #2980b9; display: block; margin-top: 6px; }
</style>
</head>
<body>

  <div style="display:flex;gap:14px;flex-wrap:wrap">

    <div class="leg-row"><div class="swatch" style="background:#27ae60;height:5px;width:28px;border-radius:3px"></div> Gratuit</div>
    <div class="leg-row"><div class="swatch" style="background:#777;height:5px;width:28px;border-radius:3px"></div> Fermé</div>
  </div>
  <div id="note">Tracés approximatifs (début→fin). Cliquez sur un PR pour ouvrir la fiche détaillée.</div>
</div>

<div id="main">
  <div id="map"></div>
  <div id="sidebar">
    <h2>LISTE DES PR (2026)</h2>
    <div id="pr-list"></div>
  </div>
</div>

// ── Couleurs ──────────────────────────────────────────────────────────────
function prColor(pr) {
  if (pr.status === 'closed')  return '#888';
  if (pr.fee === 'Gratuit')    return '#27ae60';
  if (pr.fee === '€10.50')     return '#c0392b';
  return '#e67e22';
}
function feeBadgeClass(pr) {
  if (pr.status === 'closed')  return 'fee-closed';
  if (pr.fee === 'Gratuit')    return 'fee-free';
  if (pr.fee === '€10.50')     return 'fee-exp';
  return 'fee-std';
}

// ── Carte ─────────────────────────────────────────────────────────────────
const map = L.map('map').setView([32.760, -17.000], 11);
L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenTopoMap | IFCN Madeira', maxZoom: 17
}).addTo(map);

// ── Tracés + labels ───────────────────────────────────────────────────────
const layers = [];

PR_DATA.forEach((pr, idx) => {
  const col = prColor(pr);
  const pts  = [pr.start, ...(pr.via || []), pr.end];

  // Halo blanc
  const halo = L.polyline(pts, {
    color: '#fff', weight: 8, opacity: 0.45, smoothFactor: 1,
    dashArray: pr.status === 'closed' ? '4,6' : null,
  });

  // Ligne colorée
  const line = L.polyline(pts, {
    color: col, weight: 4, opacity: 0.9, smoothFactor: 1,
    dashArray: pr.status === 'closed' ? '6,5' : pr.status === 'partial' ? '10,4' : null,
  });

  const feeLabel = pr.status === 'closed' ? '⛔ Fermé'
                 : pr.status === 'partial' ? `⚠ ${pr.fee} (partiel)` : pr.fee;
  const badgeCls = feeBadgeClass(pr);
  const popupHtml = `
    <div class="pr-popup">
      <h3>${pr.code} – ${pr.name}</h3>
      <span class="badge ${badgeCls}">${feeLabel}</span>
      <div class="meta">📏 ${pr.dist} &nbsp; ⏱ ${pr.dur}</div>
      <div class="meta" style="color:#333">${pr.desc}</div>
      <a href="${pr.url}" target="_blank">→ Fiche détaillée madere-leguide.com</a>
    </div>`;

  line.bindPopup(popupHtml);
  halo.bindPopup(popupHtml);

  // Label au milieu du tracé
  const mid = pts[Math.floor(pts.length / 2)];
  const label = L.marker(mid, {
    icon: L.divIcon({
      className: '',
      html: `<div style="background:${col};color:#fff;font-weight:800;font-size:9px;
             padding:1px 5px;border-radius:6px;border:1px solid #fff;
             box-shadow:0 1px 4px rgba(0,0,0,.5);white-space:nowrap;pointer-events:none">${pr.code}</div>`,
      iconAnchor: [0, 8],
    }),
    zIndexOffset: 400, interactive: false,
  });

  // Marqueurs départ (cercle) / arrivée (carré)
  const startM = L.circleMarker(pr.start, {
    radius: 4, color: col, fillColor: '#fff', fillOpacity: 1, weight: 2,
  }).bindPopup(popupHtml);
  const endM = L.circleMarker(pr.end, {
    radius: 4, color: col, fillColor: col, fillOpacity: 1, weight: 2,
  }).bindPopup(popupHtml);

  [halo, line, label, startM, endM].forEach(l => l.addTo(map));
  layers.push({ pr, line, halo, label, startM, endM });

  // Sidebar entry
  const listEl = document.getElementById('pr-list');
  const entry = document.createElement('div');
  entry.className = 'pr-entry';
  entry.innerHTML = `
    <div class="pr-dot" style="background:${col}"></div>
    <span class="pr-code">${pr.code}</span>
    <span class="pr-name">${pr.name}</span>
    <span class="pr-fee ${badgeCls}">${pr.status==='closed'?'⛔':pr.fee}</span>`;
  entry.addEventListener('click', () => {
    const bounds = line.getBounds();
    if (bounds.isValid()) map.fitBounds(bounds, {padding: [40, 40]});
    line.openPopup();
  });
  listEl.appendChild(entry);
});

// ── Fit bounds Madère ─────────────────────────────────────────────────────
map.fitBounds([[32.63,-17.27],[32.88,-16.63]]);

</html>
